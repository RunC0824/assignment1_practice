ira1_odometry:
  ros__parameters:
    wheel_radius_m: 0.15
    wheel_separation_m: 0.625
    encoder_counts_per_rev: 2048
    update_period_s: 0.02
    # Illustrative measurement assumptions, not measured hardware values.
    # sigma_i = k * sqrt(abs(delta_s_i)), k has units m/sqrt(m).
    noise_std_m_per_sqrt_m: 0.01
    left_scale_bias: 0.0
    right_scale_bias: 0.01
    seed: 42
    # Known experiment initial condition, never obtained from ground truth.
    initial_x_m: 0.0
    initial_y_m: 0.0
    initial_theta_rad: 0.0
